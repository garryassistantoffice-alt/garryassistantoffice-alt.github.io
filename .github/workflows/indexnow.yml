name: IndexNow ping (art songs)
on:
  push:
    branches: [main]
    paths: ['art-songs/**']
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Pages deploy
        run: sleep 90
      - name: Submit art-songs URLs to IndexNow (Bing, Yandex, etc.)
        run: |
          KEY=ce70aadc86eb4cb04ad4c1988fe49ceb
          HOST=garryassistantoffice-alt.github.io
          URLS=$(grep -o '<loc>[^<]*</loc>' art-songs/sitemap.xml | sed 's/<[^>]*>//g' | python3 -c "import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))")
          BODY=$(python3 -c "import json,sys;print(json.dumps({'host':'$HOST','key':'$KEY','keyLocation':'https://$HOST/$KEY.txt','urlList':json.loads(sys.argv[1])}))" "$URLS")
          curl -sS -w "\nHTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "$BODY"
